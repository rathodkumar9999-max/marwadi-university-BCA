<!DOCTYPE html>
<html>
<head>

    <title>Restaurant Menu</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body {
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin: 30px;
        }

        .food-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .food-card:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px #999;
        }

        .food-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .food-info {
            padding: 15px;
        }

        .price {
            color: green;
            font-weight: bold;
            font-size: 18px;
        }

        .restaurant-name {
            background-color: darkred;
            color: white;
            padding: 30px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="restaurant-name">

<h1>My Restaurant</h1>

<p>Delicious Food at Affordable Prices</p>

</div>


<div class="container">

<h2 class="mt-4">Starters</h2>

<div class="row">

<div class="col-md-4">
<div class="food-card">

<img src="samosa.jpg" alt="Samosa">

<div class="food-info">

<h3>Samosa</h3>

<p>Crispy and tasty Indian snack.</p>

<p class="price">₹50</p>

</div>

</div>
</div>


<div class="col-md-4">
<div class="food-card">

<img src="paneer.jpg" alt="Paneer Tikka">

<div class="food-info">

<h3>Paneer Tikka</h3>

<p>Fresh paneer with tasty spices.</p>

<p class="price">₹150</p>

</div>

</div>
</div>

</div>


<h2>Main Course</h2>

<div class="row">

<div class="col-md-4">
<div class="food-card">

<img src="pizza.jpg" alt="Pizza">

<div class="food-info">

<h3>Pizza</h3>

<p>Hot pizza with cheese and vegetables.</p>

<p class="price">₹250</p>

</div>

</div>
</div>


<div class="col-md-4">
<div class="food-card">

<img src="biryani.jpg" alt="Biryani">

<div class="food-info">

<h3>Veg Biryani</h3>

<p>Spicy and delicious vegetable biryani.</p>

<p class="price">₹180</p>

</div>

</div>
</div>

</div>

</div>

</body>
</html>
